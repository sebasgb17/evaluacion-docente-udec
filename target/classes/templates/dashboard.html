<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel Principal - PGC UDEC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Plataforma PGC - UDEC</a>
        <div class="navbar-nav ms-auto align-items-center">
            <span class="nav-link text-white me-3 fw-bold" th:text="${usuario.nombre + ' (' + usuario.rol + ')'}"></span>
            <a class="btn btn-outline-light btn-sm" href="/logout">Cerrar Sesión</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Evaluaciones y Cuestionarios Disponibles</h2>
    </div>

    <div class="row">
        <div class="col-md-6 col-lg-4 mb-4" th:each="ev : ${evaluaciones}">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body">
                    <span class="badge bg-primary mb-2" th:text="${ev.tipoEvaluacion}"></span>
                    <span th:if="${ev.esAutoevaluacion}" class="badge bg-warning text-dark mb-2">Autoevaluación</span>
                    <h5 class="card-title fw-bold" th:text="${ev.titulo}"></h5>
                    <p class="card-text text-muted mb-1">Total preguntas: <span th:text="${ev.preguntas.size()}"></span></p>
                </div>
                <div class="card-footer bg-white border-0 pb-3">
                    <a th:href="@{'/evaluacion/' + ${ev.id}}" class="btn btn-success w-100 mb-2 fw-bold">Responder</a>
                    <a th:if="${usuario.rol.name() == 'ADMINISTRADOR' or usuario.rol.name() == 'COORDINADOR' or usuario.rol.name() == 'DOCENTE'}" 
                       th:href="@{'/evaluacion/respuestas/' + ${ev.id}}" 
                       class="btn btn-outline-primary w-100">Ver Respuestas / Reportes</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
