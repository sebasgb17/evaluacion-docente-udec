<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Respuestas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Reporte de Respuestas</h2>
            <h5 class="text-muted" th:text="${evaluacion.titulo}"></h5>
        </div>
        <a href="/dashboard" class="btn btn-outline-secondary">Volver al Panel</a>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <h5 class="card-title fw-bold">Estadísticas del Sistema</h5>
            <p class="mb-0">Total de evaluaciones enviadas para esta prueba: <strong class="text-primary fs-5" th:text="${respuestas.size()}"></strong></p>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <div th:if="${respuestas.isEmpty()}" class="alert alert-info">
                La bandeja de respuestas está vacía. Aún no hay registros de los usuarios.
            </div>

            <div th:unless="${respuestas.isEmpty()}" class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Usuario</th>
                            <th>Respuestas Enviadas</th>
                            <th>Observaciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${respuestas}">
                            <td class="fw-bold" th:text="${r.correoUsuario}"></td>
                            <td th:text="${r.respuestas}"></td>
                            <td th:text="${r.observacion != null and !r.observacion.isEmpty() ? r.observacion : 'Sin observaciones'}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
