<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Plataforma PGC UDEC - Autenticación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 mb-4">
                <div class="card-body p-4">
                    <h3 class="card-title text-center text-primary fw-bold mb-3">Evaluación Docente UDEC</h3>
                    <p class="text-center text-muted small mb-4">Ingresa tus credenciales para acceder</p>
                    
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <div th:if="${mensajeRegistro}" class="alert alert-success" th:text="${mensajeRegistro}"></div>

                    <form action="/login" method="post">
                        <div class="mb-3">
                            <label class="form-label">Correo Institucional</label>
                            <input type="email" name="correo" class="form-control" placeholder="usuario@udec.edu.co" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" name="clave" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Iniciar Sesión</button>
                    </form>
                </div>
            </div>

            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <h5 class="card-title text-center mb-3">Crear Nueva Cuenta</h5>
                    <div th:if="${errorRegistro}" class="alert alert-danger" th:text="${errorRegistro}"></div>
                    <form action="/registro" method="post">
                        <div class="mb-2">
                            <input type="text" name="nombre" class="form-control" placeholder="Nombre completo" required>
                        </div>
                        <div class="mb-2">
                            <input type="email" name="correo" class="form-control" placeholder="Correo electrónico" required>
                        </div>
                        <div class="mb-2">
                            <input type="password" name="clave" class="form-control" placeholder="Contraseña" required>
                        </div>
                        <div class="mb-3">
                            <select name="rol" class="form-select">
                                <option value="ESTUDIANTE">Estudiante</option>
                                <option value="DOCENTE">Docente</option>
                                <option value="COORDINADOR">Coordinador</option>
                                <option value="ADMINISTRADOR">Administrador</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-outline-secondary w-100">Registrarse</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
